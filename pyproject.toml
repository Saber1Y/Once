[project]
name = "once"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Saber1Y", email = "ayodejiakintobi1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "neatlogs>=1.4.26",
    "openai>=3.28.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
once = "once:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
